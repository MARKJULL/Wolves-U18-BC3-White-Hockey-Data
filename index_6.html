<style>
:root{--bg:#eceef1;--card:#fff;--ink:#2b2f35;--mut:#6a727c;--pri:#b83a2e;--pri-d:#9c2f25;--black:#000;--bar:#bf3437;--ok:#12a150;--bad:#bf3437;--line:#dde1e6;--soft:#fbeceb;--head:'Oswald','Arial Narrow',Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.4 'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
header{position:sticky;top:0;z-index:5;background:var(--black);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:11px;min-height:64px;border-bottom:5px solid var(--bar)}
header .logo{height:46px;width:auto;display:block}
header h1{font:600 19px/1.1 var(--head);text-transform:uppercase;letter-spacing:.04em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font:400 12px 'Open Sans',sans-serif;letter-spacing:.02em;text-transform:none;color:#cfcfcf;margin-top:2px}
header .back{font-size:28px;line-height:1;color:#fff;padding:0 6px 4px 0}
.chip-s{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.chip-s.ok::before,.chip-s.saving::before,.chip-s.offline::before,.chip-s.auth::before,.chip-s.demo::before{content:"● ";}
.chip-s.ok::before{color:#4ade80}.chip-s.saving::before{color:#fbbf24}.chip-s.offline::before,.chip-s.auth::before{color:#ff7a7a}.chip-s.demo::before{color:#93c5fd}
main{padding:12px;max-width:640px;margin:0 auto}
.mut{color:var(--mut)}
small{color:var(--mut);font-size:12px}
h2{font:600 14px var(--head);text-transform:uppercase;letter-spacing:.08em;color:#444;margin:20px 2px 8px;padding-left:9px;border-left:4px solid var(--bar)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.07);width:100%;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row small{display:block}
.score{font:600 24px var(--head)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;text-align:center}
.btn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.primary:active{background:var(--pri-d)}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.dark{background:#000;color:#fff;border-color:#000}
.btn.big{width:100%;padding:15px;font:600 18px var(--head);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.btn.sync{width:100%;margin-bottom:6px;font-size:14px;color:#444}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btns .btn{flex:1;min-width:120px;padding:10px 12px;font-size:14px}
.seg{display:flex;background:#d9dde2;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;text-align:center;padding:9px 4px;border-radius:8px;font:600 15px var(--head);letter-spacing:.06em;text-transform:uppercase;color:#666}
.seg button.on{background:#000;color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#000;border-top:4px solid var(--bar);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;text-align:center;padding:8px 0 7px;font:500 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:#a9a9a9;border-bottom:3px solid transparent}
nav.tabs button span{display:block;font-size:19px;line-height:1.25}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
.pl{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border-radius:10px;margin-bottom:6px;width:100%}
.pl .n{flex:1;font-weight:700}
.pl .t{font-size:12px;color:var(--mut)}
.pill{min-width:54px;text-align:center;padding:6px 10px;border-radius:99px;font:600 13px var(--head);letter-spacing:.05em;background:#eceef1;color:var(--mut)}
.pl.on .pill{background:var(--ok);color:#fff}
.pl.off .pill{background:#e3e5e8;color:#777}
.pl.off .n{color:#777}
.line{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border-left:4px solid var(--bar)}
.line .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:600 14px var(--head);letter-spacing:.06em;text-transform:uppercase}
.line .hd button{color:var(--mut);font-size:18px;padding:0 6px}
.slots{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.slot{background:var(--soft);border-radius:9px;padding:8px 6px;text-align:center;min-height:54px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.slot small{font:600 12px var(--head);letter-spacing:.08em;color:var(--pri)}
.slot b{font-size:14px;line-height:1.15}
.slot.empty{background:#f4f5f7;border:1.5px dashed #c5cbd3}
.slot.empty b{color:#b3bcc7}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;border:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;border-top:5px solid var(--bar);max-height:92vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet h3{margin:2px 0 10px;font:600 22px var(--head);text-transform:uppercase;letter-spacing:.04em}
.sheet label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-weight:700;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{padding:9px 14px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:#fff;border-radius:10px;padding:12px;margin-bottom:5px;font-weight:700}
.prow.sel{outline:2px solid var(--pri)}
.prow small{text-align:right}
.big-score{display:flex;align-items:center;justify-content:center;gap:18px;background:#000;color:#fff;border-radius:12px;border-bottom:5px solid var(--bar);padding:14px;margin-bottom:10px}
.big-score div{text-align:center}.big-score b{font:700 46px var(--head);display:block;line-height:1}.big-score small{color:#bbb;font:500 12px var(--head);letter-spacing:.1em;text-transform:uppercase}
.big-score i{font-style:normal;font-size:28px;opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.two .btn{padding:18px 8px;font:600 18px var(--head);letter-spacing:.05em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid #eef0f2}
th{font:500 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#000}
td:first-child,th:first-child{text-align:left;padding-left:12px}
.banner{background:#fff4d6;color:#6b4e00;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.tag{display:inline-block;font:600 11px var(--head);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#000;color:#fff;margin-right:6px;vertical-align:1px}
.oig{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.oi{min-width:0;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.oi b{display:block;font:600 13px var(--head);letter-spacing:.06em;text-transform:uppercase}
.oi small{display:block;line-height:1.25}
.oi.on{background:#000;border-color:#000;color:#fff}.oi.on small{color:#ddd}

const SEED_NAMES = ['Akram Jomaa','Archer Shandro','Asher Tong','Ben Pratt','Dane Sawyer','Derek MacIntyre','Enzo Galambos','Findley Jull','Gabriel Houliat','Gavin Burns','Grayson Archibald','Ian Hunt','Jenson Kehoe','Joshua Keyes','Kyle Walker','Luca Wurster','Mylo Murphy','Nicholas Columbos'];
const seedRoster = () => SEED_NAMES.map(n => ({ name: n, jersey: '', primary: n === 'Jenson Kehoe' ? 'G' : '', also: [], active: true }));
const POS = ['LW','C','RW','LD','RD','G'];

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtDate = d => { const x = new Date(d + 'T12:00:00'); return isNaN(x) ? (d || '') : x.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); };
const fmtTime = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); return isNaN(h) ? t : ((h % 12) || 12) + ':' + String(m || 0).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
const when = x => [fmtDate(x.date), fmtTime(x.time), x.location].filter(Boolean).join(' · ');
const byWhen = (a, b) => (String(a.date) + String(a.time || '')).localeCompare(String(b.date) + String(b.time || ''));
const short = n => { const p = String(n).split(' '); return p.length > 1 ? p[0] + ' ' + p[p.length-1][0] + '.' : n; };
const ld = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const isF = p => ['LW','C','RW'].includes(p), isD = p => ['LD','RD'].includes(p);

/* ================= state ================= */
const demo = !CONFIG.API_URL;
let S = ld('hl_state', { roster: [], games: [], lines: [], events: [], attendance: [], schedule: [], notes: [] });
S.schedule = S.schedule || []; S.notes = S.notes || [];
let Q = ld('hl_queue', []);
let ui = { tab: 'games', gameId: null, gtab: 'dress', modal: null, stab: 'players', lfilter: 'ev', oi: {} };
let status = demo ? 'demo' : 'ok', inflight = null, flushTimer = null, asking = false;
if (demo && !S.roster.length) S.roster = seedRoster();
const persist = () => { sv('hl_state', S); sv('hl_queue', Q); };

const player = n => S.roster.find(p => p.name === n);
const game = id => S.games.find(g => g.id === id);
const canPlay = (p, pos) => p.primary === pos || (p.also || []).includes(pos);
const posTag = p => [p.primary, ...(p.also || [])].filter(Boolean).join('/');

/* ================= sync ================= */
function enqueue(op) {
  if (demo) { persist(); return; }
  if (['saveLines','saveGame','saveRoster','saveAttendance'].includes(op.action)) {
    Q = Q.filter(o => o === inflight || o.k !== op.k);
  }
  Q.push(op); persist(); setStatus('saving');
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500);
}
async function post(op) {
  const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...op, key: ld('hl_key', '') }) });
  const j = await r.json();
  if (!j.ok) { if (j.error === 'auth') { askKey(); throw new Error('auth'); } throw new Error(j.error); }
}
function askKey() {
  if (asking) return; asking = true;
  setTimeout(() => { const k = prompt('Team passcode?'); if (k !== null) sv('hl_key', k.trim()); asking = false; flush(); }, 50);
}
async function flush() {
  if (demo || inflight || !Q.length) return;
  setStatus('saving');
  while (Q.length) {
    inflight = Q[0];
    try { await post(inflight); Q.shift(); persist(); }
    catch (e) { inflight = null; setStatus(e.message === 'auth' ? 'auth' : 'offline'); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 8000); return; }
    inflight = null;
  }
  setStatus('ok');
}
async function refresh(manual) {
  if (demo) return;
  if (Q.length || inflight) { flush(); return; }
  try {
    const r = await fetch(CONFIG.API_URL + '?action=bootstrap&key=' + encodeURIComponent(ld('hl_key', '')) + '&_=' + Date.now());
    const j = await r.json();
    if (!j.ok) { if (j.error === 'auth') askKey(); throw new Error(j.error); }
    if (ui.modal && !manual) return;
    const n = { roster: j.roster, games: j.games, lines: j.lines, events: j.events, attendance: j.attendance, schedule: j.schedule || [], notes: j.notes || [] };
    let changed = false;
    if (!n.roster.length) { n.roster = seedRoster(); enqueue({ k: 'saveRoster', action: 'saveRoster', roster: n.roster }); changed = true; }
    if (JSON.stringify(n) !== JSON.stringify(S)) { S = n; changed = true; }
    persist(); if (!Q.length) setStatus('ok'); if (changed) render();
  } catch (e) { setStatus(e.message === 'auth' ? 'auth' : 'offline'); }
}
function setStatus(s) { status = s; const el = $('#sync'); if (el) { el.className = 'chip-s ' + s; el.textContent = syncText(); } }
const syncText = () => ({ ok: 'Synced', saving: 'Saving…', offline: 'Offline · ' + Q.length + ' waiting', auth: 'Passcode needed', demo: 'Demo (this phone only)' }[status]);

/* ================= lines model ================= */
const defaultLines = () => {
  const r = [];
  for (let i = 1; i <= 4; i++) ['LW','C','RW'].forEach(pos => r.push({ unit: 'F' + i, pos, player: '' }));
  for (let i = 1; i <= 3; i++) ['LD','RD'].forEach(pos => r.push({ unit: 'D' + i, pos, player: '' }));
  r.push({ unit: 'G1', pos: 'G', player: '' });
  return r;
};
const getLines = gid => { const r = S.lines.filter(x => x.gameId === gid); return r.length ? r.map(x => ({ unit: x.unit, pos: x.pos, player: x.player || '' })) : defaultLines(); };
function normalize(rows) {
  const out = [];
  ['F','D','G'].forEach(k => {
    const us = [...new Set(rows.filter(r => r.unit[0] === k).map(r => r.unit))];
    us.forEach((u, i) => rows.filter(r => r.unit === u).forEach(r => out.push({ ...r, unit: k + (i + 1) })));
  });
  return out;
}
function commitLines(gid, rows, noRender) {
  rows = normalize(rows);
  S.lines = S.lines.filter(x => x.gameId !== gid).concat(rows.map(x => ({ gameId: gid, ...x })));
  const g = game(gid);
  enqueue({ k: 'saveLines:' + gid, action: 'saveLines', gameId: gid, date: g.date, opponent: g.opponent, lines: rows });
  persist(); if (!noRender) render();
}
const unitLabel = u => ({ F: 'Line ', D: 'Pair ', G: 'Goalie' }[u[0]] + (u[0] === 'G' ? '' : u.slice(1)));
function assign(gid, unit, pos, name) {
  const rows = getLines(gid);
  const t = rows.find(r => r.unit === unit && r.pos === pos);
  const src = name ? rows.find(r => r.player === name) : null;
  if (src && src !== t) src.player = t.player;
  t.player = name;
  commitLines(gid, rows);
}
function saveGame(g) { enqueue({ k: 'saveGame:' + g.id, action: 'saveGame', game: { ...g } }); persist(); }
function recalc(g) { g.gf = S.events.filter(e => e.gameId === g.id && e.type === 'GF').length; g.ga = S.events.filter(e => e.gameId === g.id && e.type === 'GA').length; saveGame(g); }
function sessions() {
  const m = {};
  S.attendance.forEach(a => { (m[a.sessionId] ??= { id: a.sessionId, date: a.date, type: a.type, rows: [] }).rows.push(a); });
  return Object.values(m).sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

/* ================= views ================= */
function render() {
  const sh = document.querySelector('.sheet'), st = sh ? sh.scrollTop : 0, ws = window.scrollY;
  $('#app').innerHTML = headerHTML() + '<main>' + bodyHTML() + '</main>' + tabsHTML() + (ui.modal ? modalHTML() : '');
  const sh2 = document.querySelector('.sheet'); if (sh2) sh2.scrollTop = st;
  window.scrollTo(0, ws);
}
function headerHTML() {
  const g = ui.tab === 'games' && ui.gameId ? game(ui.gameId) : null;
  const title = g ? `vs ${esc(g.opponent || 'TBD')}<small>${esc([fmtDate(g.date), fmtTime(g.time)].filter(Boolean).join(' · '))}</small>` : `${esc(CONFIG.TEAM_NAME)}<small>${esc(CONFIG.SUBTITLE)}</small>`;
  return `<header>${g ? '<button class="back" data-act="back">‹</button>' : ''}<img class="logo" src="${LOGO}" alt="Wolves"><h1>${title}</h1><button class="chip-s ${status}" id="sync" data-act="sync">${esc(syncText())}</button></header>`;
}
function tabsHTML() {
  const t = [['games','🏒','Games'],['practice','📋','Practice'],['stats','📊','Stats'],['roster','👥','Roster']];
  return '<nav class="tabs">' + t.map(([k, i, l]) => `<button class="${ui.tab === k ? 'on' : ''}" data-act="nav" data-tab="${k}"><span>${i}</span>${l}</button>`).join('') + '</nav>';
}
function bodyHTML() {
  const demoBanner = demo ? '<div class="banner">Demo mode: data is saved only on this phone. Add your Apps Script URL to <b>CONFIG.API_URL</b> in index.html to share with coaches and feed Google Sheets.</div>' : '';
  if (ui.tab === 'games') return demoBanner + (ui.gameId && game(ui.gameId) ? gameView(game(ui.gameId)) : gamesList());
  if (ui.tab === 'practice') return demoBanner + practiceView();
  if (ui.tab === 'stats') return statsView();

}
const syncBtn = () => demo ? '' : '<button class="btn sync" data-act="syncSched">↻ Sync schedule from TeamLinkt</button>';
const gameCard = g => { const t = today(), fut = g.date > t && !(g.gf + g.ga); return `<button class="card row" data-act="openGame" data-id="${g.id}"><div><b>vs ${esc(g.opponent || 'TBD')}</b><small>${esc(when(g))}</small></div>${fut ? '<small>Upcoming</small>' : `<div class="score">${g.gf}–${g.ga}</div>`}</button>`; };
function gamesList() {
  const t = today(), up = S.games.filter(g => g.date >= t).sort(byWhen), past = S.games.filter(g => g.date < t).sort(byWhen).reverse();
  return '<button class="btn primary big" data-act="newGame">+ New game</button>' + syncBtn() +
    (up.length ? '<h2>Upcoming</h2>' + up.map(gameCard).join('') : '') +
    (past.length ? '<h2>Past</h2>' + past.map(gameCard).join('') : '') +
    (S.games.length ? '' : '<p class="mut">No games yet. ' + (demo ? 'Tap “New game” to set one up.' : 'Tap “Sync schedule” to import from TeamLinkt.') + '</p>');
}
function gameView(g) {
  const seg = [['dress','Dress'],['lines','Lines'],['score','Score'],['notes','Notes']];
  return `<div class="seg">${seg.map(([k, l]) => `<button class="${ui.gtab === k ? 'on' : ''}" data-act="gtab" data-tab="${k}">${l}</button>`).join('')}</div>` +
    (ui.gtab === 'dress' ? dressView(g) : ui.gtab === 'lines' ? linesView(g) : ui.gtab === 'score' ? scoreView(g) : notesView(g));
}
function dressView(g) {
  const act = S.roster.filter(p => p.active !== false);
  const d = g.dressed.map(player).filter(Boolean);
  const cnt = { F: d.filter(p => isF(p.primary)).length, D: d.filter(p => isD(p.primary)).length, G: d.filter(p => p.primary === 'G').length, U: d.filter(p => !p.primary).length };
  return `<div class="card"><b>${g.dressed.length} dressed</b> <small>· ${cnt.F} F · ${cnt.D} D · ${cnt.G} G${cnt.U ? ' · ' + cnt.U + ' no position set' : ''}</small></div>
  <div class="btns"><button class="btn" data-act="dressAll">All in</button><button class="btn" data-act="dressNone">All out</button><button class="btn" data-act="editGame">Edit game</button></div>` +
    act.map(p => { const on = g.dressed.includes(p.name); return `<button class="pl ${on ? 'on' : 'off'}" data-act="toggleDress" data-name="${esc(p.name)}"><span class="n">${p.jersey ? '#' + esc(p.jersey) + ' ' : ''}${esc(p.name)}</span><span class="t">${esc(posTag(p))}</span><span class="pill">${on ? 'IN' : 'OUT'}</span></button>`; }).join('');
}
function linesView(g) {
  const rows = getLines(g.id), units = [...new Set(rows.map(r => r.unit))];
  const card = u => `<div class="line"><div class="hd"><span>${unitLabel(u)}</span>${u[0] !== 'G' ? `<button data-act="rmUnit" data-unit="${u}" aria-label="Remove">✕</button>` : ''}</div><div class="slots">${rows.filter(r => r.unit === u).map(r => `<button class="slot ${r.player ? '' : 'empty'}" data-act="pick" data-unit="${u}" data-pos="${r.pos}"><small>${r.pos}</small><b>${r.player ? esc(short(r.player)) : '—'}</b></button>`).join('')}</div></div>`;
  const assigned = new Set(rows.map(r => r.player).filter(Boolean));
  const spare = g.dressed.filter(n => !assigned.has(n));
  const missing = rows.filter(r => r.player && !g.dressed.includes(r.player)).length;
  return `<h2>Forwards</h2>${units.filter(u => u[0] === 'F').map(card).join('')}
  <h2>Defense</h2>${units.filter(u => u[0] === 'D').map(card).join('')}
  <h2>Goalie</h2>${units.filter(u => u[0] === 'G').map(card).join('')}
  <h2>Not on a line (${spare.length})</h2><div class="bench">${spare.length ? spare.map(n => `<span>${esc(short(n))}</span>`).join('') : '<small>Everyone dressed is placed</small>'}</div>
  <div class="btns" style="margin-top:16px"><button class="btn" data-act="addF">+ Forward line</button><button class="btn" data-act="addD">+ D pair</button></div>
  <div class="btns"><button class="btn" data-act="copyLast">Copy last game</button><button class="btn" data-act="autofill">Auto-fill empty</button><button class="btn danger" data-act="clearLines">Clear all</button></div>${missing ? '<p class="mut">Some placed players are not dressed.</p>' : ''}`;
}
/* ---- on-ice tracking ---- */
const unitsOf = (gid, k) => [...new Set(getLines(gid).filter(r => r.unit[0] === k).map(r => r.unit))];
const unitNames = (gid, u) => getLines(gid).filter(r => r.unit === u && r.player).map(r => r.player);
const last = n => String(n).split(' ').slice(1).join(' ') || n;
function oiSel(gid) {
  const o = (ui.oi[gid] ??= { F: 'F1', D: 'D1', sit: 'EV', per: '' });
  const f = unitsOf(gid, 'F'), d = unitsOf(gid, 'D');
  if (!f.includes(o.F)) o.F = f[0] || '';
  if (!d.includes(o.D)) o.D = d[0] || '';
  return o;
}
const snap = (gid, F, D) => ({ fLine: unitNames(gid, F), dPair: unitNames(gid, D) });
function goalieNow(gid) {
  const slot = getLines(gid).find(r => r.pos === 'G' && r.player);
  return slot ? slot.player : (game(gid).dressed.find(n => player(n)?.primary === 'G') || '');
}
const baseEv = (gid, type) => ({ id: uid(), gameId: gid, type, period: '', player: '', a1: '', a2: '', goalie: '', situation: 'EV', fLine: [], dPair: [], infraction: '', mins: 0, ts: Date.now() });
function logEvent(gid, type, extra) {
  const o = oiSel(gid);
  addEvent({ ...baseEv(gid, type), period: o.per || '', situation: o.sit, ...snap(gid, o.F, o.D), ...extra });
}
const INFR = ['Tripping','Hooking','Slashing','Holding','Interference','Cross-checking','Roughing','High-sticking','Boarding','Check from behind','Too many men','Delay of game','Other'];

function onIceCard(g) {
  const o = oiSel(g.id), fu = unitsOf(g.id, 'F'), du = unitsOf(g.id, 'D');
  const chip = (u, k) => `<button class="oi ${o[k] === u ? 'on' : ''}" data-act="oi" data-k="${k}" data-v="${u}"><b>${unitLabel(u)}</b><small>${esc(unitNames(g.id, u).map(last).join(' · ') || 'empty')}</small></button>`;
  const per = ['1','2','3','OT'].map(p => `<button class="chip ${o.per === p ? 'on' : ''}" data-act="oi" data-k="per" data-v="${p}">${p === 'OT' ? 'OT' : 'P' + p}</button>`).join('');
  const sit = [['EV','Even strength'],['PP','Our power play'],['SH','Our penalty kill']].map(([k, l]) => `<button class="chip ${o.sit === k ? 'on' : ''}" data-act="oi" data-k="sit" data-v="${k}">${l}</button>`).join('');
  return `<h2>On the ice now</h2><div class="card"><div class="chips" style="margin-bottom:8px">${per}</div><div class="chips" style="margin-bottom:10px">${sit}</div><div class="oig">${fu.map(u => chip(u, 'F')).join('')}</div><div class="oig" style="margin-bottom:0">${du.map(u => chip(u, 'D')).join('')}</div></div>`;
}
function evRow(e) {

  let a, b;
  if (e.type === 'GF') { a = '🚨 ' + esc(e.player); b = [t, (e.a1 || e.a2) ? 'Assists: ' + [e.a1, e.a2].filter(Boolean).map(esc).join(', ') : 'Unassisted'].filter(Boolean).join(' · '); }
  else if (e.type === 'GA') { a = '🥅 Goal against'; b = [t, 'Goalie: ' + esc(e.goalie || '—')].filter(Boolean).join(' · '); }
  else { a = '⏱ ' + (e.type === 'PEN' ? esc(e.player) : 'Opponent') + ' – ' + esc(e.infraction); b = [t, e.mins + ' min'].filter(Boolean).join(' · '); }
  return `<div class="card row"><div><b>${a}</b><small>${b}</small></div><button data-act="delEvent" data-id="${e.id}" aria-label="Delete" style="font-size:18px;color:var(--mut)">✕</button></div>`;
}
function scoreView(g) {

    `<div class="quick">
      <button class="btn ok" data-act="goalModal">+ Goal</button><button class="btn danger" data-act="gaModal">+ Goal against</button>
      <button class="btn dark" data-act="shot" data-t="SF">Shot for · ${sf}</button><button class="btn dark" data-act="shot" data-t="SA">Shot against · ${sa}</button>
      <button class="btn" data-act="penModal" data-opp="0">Penalty – us</button><button class="btn" data-act="penModal" data-opp="1">Penalty – them</button>
    </div><div class="hint">Goals count as shots automatically; only tap “Shot” for shots that did not score.</div>` +

function notesView(g) {

    (ns.length ? ns.map(n => `<div class="card"><div class="row"><span><span class="tag">${n.player ? esc(n.player) : 'General'}</span><small>${esc(new Date(n.ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</small></span><button data-act="delNote" data-id="${n.id}" aria-label="Delete" style="color:var(--mut);font-size:18px">✕</button></div><div class="note">${esc(n.text)}</div></div>`).join('') : '<p class="mut">No notes yet. Tag a note to a player or leave it as General.</p>');

/* ---- stats ---- */
function calcStats() {
  const ev = S.events;
  return S.roster.map(p => {
    const on = e => (e.fLine || []).includes(p.name) || (e.dPair || []).includes(p.name);
    const gp = S.games.filter(g => g.dressed.includes(p.name)).length;
    const gl = ev.filter(e => e.type === 'GF' && e.player === p.name).length;
    const as = ev.filter(e => e.type === 'GF' && (e.a1 === p.name || e.a2 === p.name)).length;
    const plus = ev.filter(e => e.type === 'GF' && e.situation !== 'PP' && on(e)).length;
    const minus = ev.filter(e => e.type === 'GA' && e.situation !== 'SH' && on(e)).length;
    const pim = ev.filter(e => e.type === 'PEN' && e.player === p.name).reduce((a, e) => a + (e.mins || 0), 0);
    const ga = ev.filter(e => e.type === 'GA' && e.goalie === p.name).length;
    const sv = ev.filter(e => e.type === 'SA' && e.goalie === p.name).length;
    const rows = S.attendance.filter(a => a.player === p.name);
    return { p, gp, gl, as, pts: gl + as, pm: plus - minus, pim, ga, sv, pr: rows.filter(a => a.present === 'Yes').length, prT: rows.length };
  });
}
function statsView() {
  const seg = `<div class="seg"><button class="${ui.stab === 'players' ? 'on' : ''}" data-act="stab" data-tab="players">Players</button><button class="${ui.stab === 'lines' ? 'on' : ''}" data-act="stab" data-tab="lines">Lines</button></div>`;
  return seg + (ui.stab === 'lines' ? lineStatsView() : playerStatsView());
}
function playerStatsView() {
  const st = calcStats(), ev = S.events;
  const sk = st.filter(r => r.p.primary !== 'G' || r.pts > 0).sort((a, b) => b.pts - a.pts || b.gl - a.gl || a.p.name.localeCompare(b.p.name));
  const gk = st.filter(r => r.p.primary === 'G' || r.ga > 0 || r.sv > 0);
  const pr = r => r.prT ? Math.round(100 * r.pr / r.prT) + '%' : '–';
  const sgn = n => n > 0 ? '+' + n : String(n);
  const w = S.games.filter(g => g.gf > g.ga).length, l = S.games.filter(g => g.gf < g.ga).length, t = S.games.filter(g => g.gf === g.ga && g.gf + g.ga > 0).length;
  const ids = new Set(ev.map(e => e.gameId)), n = ids.size;
  const sfT = ev.filter(e => e.type === 'SF').length + ev.filter(e => e.type === 'GF').length, saT = ev.filter(e => e.type === 'SA').length + ev.filter(e => e.type === 'GA').length;
  const opp = ev.filter(e => e.type === 'PENO').length, us = ev.filter(e => e.type === 'PEN').length;
  const ppg = ev.filter(e => e.type === 'GF' && e.situation === 'PP').length, ppga = ev.filter(e => e.type === 'GA' && e.situation === 'SH').length;
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
  const svp = r => (r.sv + r.ga) ? (r.sv / (r.sv + r.ga)).toFixed(3).replace(/^0/, '') : '–';
  return `<div class="card"><b>Record:</b> ${w}-${l}-${t} <small>· ${S.games.length} games · ${sessions().length} practices</small></div>
  ${n ? `<div class="card"><small>Shots/game</small> <b>${(sfT / n).toFixed(1)}</b> for · <b>${(saT / n).toFixed(1)}</b> against<br><small>Power play</small> <b>${ppg}/${opp}</b> (${pct(ppg, opp)}) · <small>Penalty kill</small> <b>${us - ppga}/${us}</b> (${pct(us - ppga, us)}) · <small>PIM/game</small> <b>${(ev.filter(e => e.type === 'PEN').reduce((a, e) => a + (e.mins || 0), 0) / n).toFixed(1)}</b></div>` : ''}
  <h2>Skaters</h2><table><tr><th>Player</th><th>GP</th><th>G</th><th>A</th><th>P</th><th>+/-</th><th>PIM</th><th>Prac</th></tr>${sk.map(r => `<tr><td>${esc(short(r.p.name))}</td><td>${r.gp}</td><td>${r.gl}</td><td>${r.as}</td><td><b>${r.pts}</b></td><td>${sgn(r.pm)}</td><td>${r.pim}</td><td>${pr(r)}</td></tr>`).join('')}</table>
  <h2>Goalies</h2><table><tr><th>Player</th><th>GP</th><th>Saves</th><th>GA</th><th>SV%</th><th>GAA</th><th>Prac</th></tr>${gk.length ? gk.map(r => `<tr><td>${esc(short(r.p.name))}</td><td>${r.gp}</td><td>${r.sv}</td><td>${r.ga}</td><td>${svp(r)}</td><td>${r.gp ? (r.ga / r.gp).toFixed(2) : '–'}</td><td>${pr(r)}</td></tr>`).join('') : '<tr><td colspan="7" class="mut">Set a player’s position to G in Roster</td></tr>'}</table>
  <div class="hint">+/- counts even-strength goals and shorthanded goals for/against while a player's line or pair was selected as on the ice. Saves come from “Shot against” taps.</div>`;
}
const lbl = arr => arr.map(n => esc(last(n))).join(' · ');
const kF = e => e.fLine && e.fLine.length ? { key: [...e.fLine].sort().join('|'), label: lbl(e.fLine) } : null;
const kD = e => e.dPair && e.dPair.length ? { key: [...e.dPair].sort().join('|'), label: lbl(e.dPair) } : null;
const kFD = e => { const f = kF(e), d = kD(e); return f && d ? { key: f.key + '||' + d.key, label: f.label + '<small>' + d.label + '</small>' } : null; };
function lineAgg(keyFn) {
  const m = {};
  S.events.forEach(e => {
    if (!['GF','GA','SF','SA'].includes(e.type)) return;
    if (ui.lfilter === 'ev' && e.situation && e.situation !== 'EV') return;
    const k = keyFn(e); if (!k) return;
    const o = (m[k.key] ??= { label: k.label, gf: 0, ga: 0, sf: 0, sa: 0 });
    o[e.type.toLowerCase()]++;
  });
  return Object.values(m).map(o => { const sfT = o.sf + o.gf, saT = o.sa + o.ga, tot = sfT + saT; return { ...o, sfT, saT, diff: o.gf - o.ga, share: tot ? sfT / tot : null, n: o.gf + o.ga + o.sf + o.sa }; })
    .sort((a, b) => b.diff - a.diff || (b.share || 0) - (a.share || 0) || b.n - a.n);
}
function lineTable(title, rows) {

}
function lineStatsView() {

/* ================= modals ================= */
const chipGrid = (names, sel, act) => `<div class="grid">${names.map(n => `<button class="chip ${sel === n ? 'on' : ''}" data-act="${act}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
const periodChips = m => `<div class="chips">${['1','2','3','OT'].map(p => `<button class="chip ${m.period === p ? 'on' : ''}" data-act="setPeriod" data-name="${p}">${p === 'OT' ? 'OT' : 'P' + p}</button>`).join('')}</div>`;
const sitChips = m => `<div class="chips">${[['EV', 'Even strength'], ['PP', 'Our power play'], ['SH', 'Our penalty kill']].map(([k, l]) => `<button class="chip ${m.sit === k ? 'on' : ''}" data-act="setSit" data-name="${k}">${l}</button>`).join('')}</div>`;
const unitChips = (m, k) => `<div class="chips">${unitsOf(m.gid, k).map(u => `<button class="chip ${m[k] === u ? 'on' : ''}" data-act="setM${k}" data-name="${u}">${unitLabel(u)}</button>`).join('')}</div>`;
function modalHTML() {

    const g = game(m.gid), sn = snap(m.gid, m.F, m.D), on = [...sn.fLine, ...sn.dPair];
    const all = g.dressed.map(player).filter(p => p && p.primary !== 'G').map(p => p.name);
    const sk = [...all.filter(n => on.includes(n)), ...all.filter(n => !on.includes(n))];
    body = `<h3>Goal</h3><label>Period</label>${periodChips(m)}<label>Strength</label>${sitChips(m)}<label>Forward line on ice</label>${unitChips(m, 'F')}<label>D pair on ice</label>${unitChips(m, 'D')}<label>Scored by</label>${chipGrid(sk, m.scorer, 'setScorer')}<label>Assist 1 (optional)</label>${chipGrid(sk.filter(n => n !== m.scorer), m.a1, 'setA1')}<label>Assist 2 (optional)</label>${chipGrid(sk.filter(n => n !== m.scorer && n !== m.a1), m.a2, 'setA2')}<div class="btns" style="margin-top:16px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn ok" data-act="saveGoal" ${m.scorer ? '' : 'disabled style="opacity:.4"'}>Save goal</button></div>`;
  } else if (m.kind === 'ga') {
    const g = game(m.gid), names = g.dressed.filter(n => player(n)?.primary === 'G'), all = names.length ? names : g.dressed;
    body = `<h3>Goal against</h3><label>Period</label>${periodChips(m)}<label>Strength</label>${sitChips(m)}<label>Forward line on ice</label>${unitChips(m, 'F')}<label>D pair on ice</label>${unitChips(m, 'D')}<label>Goalie in net</label>${chipGrid(all, m.goalie, 'setGoalie')}<div class="btns" style="margin-top:16px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="saveGA">Save</button></div>`;
  } else if (m.kind === 'pen') {
    const g = game(m.gid), ok = m.infr && (m.opp || m.player);
    body = `<h3>${m.opp ? 'Penalty – opponent' : 'Penalty – our team'}</h3><label>Period</label>${periodChips(m)}${m.opp ? '' : '<label>Player</label>' + chipGrid(g.dressed, m.player, 'setPlayer')}<label>Infraction</label><div class="chips">${INFR.map(i => `<button class="chip ${m.infr === i ? 'on' : ''}" data-act="setInfr" data-name="${esc(i)}">${i}</button>`).join('')}</div><label>Minutes</label><div class="chips">${[2, 4, 5, 10].map(x => `<button class="chip ${m.mins === x ? 'on' : ''}" data-act="setMins" data-name="${x}">${x}</button>`).join('')}</div><div class="btns" style="margin-top:16px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="savePen" ${ok ? '' : 'disabled style="opacity:.4"'}>Save penalty</button></div>`;
  } else if (m.kind === 'note') {
    const g = game(m.gid);
    body = `<h3>Game note</h3><label>About (optional, tap a player)</label>${chipGrid(g.dressed, m.player, 'setNotePlayer')}<label>Note</label><textarea data-bind="text" rows="6" placeholder="What worked, what to fix, who stood out…">${esc(m.text)}</textarea><div class="btns" style="margin-top:12px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveNote">Save note</button></div>`;
  } else if (m.kind === 'game') {
    body = `<h3>${m.id ? 'Edit game' : 'New game'}</h3><label>Date</label><input type="date" data-bind="date" value="${esc(m.date)}"><label>Opponent</label><input data-bind="opponent" value="${esc(m.opponent)}" placeholder="Team name"><label>Location (optional)</label><input data-bind="location" value="${esc(m.location)}"><div class="btns" style="margin-top:16px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveGameInfo">Save</button></div>${m.id ? '<div class="btns"><button class="btn danger" data-act="delGame">Delete game</button></div>' : ''}`;
  } else if (m.kind === 'session') {
    body = `<h3>${m.id ? 'Attendance' : 'Take attendance'}</h3><label>Date</label><input type="date" data-bind="date" value="${esc(m.date)}"><label>Type</label><select data-bind="type">${['Practice','Skills','Other'].map(t => `<option ${m.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select><div class="btns"><button class="btn" data-act="presentAll">All present</button><button class="btn" data-act="presentNone">All absent</button></div><b>${m.present.length} / ${m.names.length} present</b><div style="margin-top:8px">${m.names.map(n => { const on = m.present.includes(n); return `<button class="pl ${on ? 'on' : 'off'}" data-act="togglePresent" data-name="${esc(n)}"><span class="n">${esc(n)}</span><span class="pill">${on ? 'HERE' : 'ABSENT'}</span></button>`; }).join('')}</div><div class="btns"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveSession">Save</button></div>${m.id ? '<div class="btns"><button class="btn danger" data-act="delSession">Delete this session</button></div>' : ''}`;
  } else if (m.kind === 'player') {
    body = `<h3>${m.orig ? 'Edit player' : 'Add player'}</h3><label>Name</label><input data-bind="name" value="${esc(m.name)}" ${m.orig ? 'readonly' : ''}><label>Jersey # (optional)</label><input data-bind="jersey" inputmode="numeric" value="${esc(m.jersey)}"><label>Primary position</label><select data-bind="primary"><option value="">— not set —</option>${POS.map(p => `<option ${m.primary === p ? 'selected' : ''}>${p}</option>`).join('')}</select><label>Can also play</label><div class="chips">${POS.filter(p => p !== m.primary).map(p => `<button class="chip ${m.also.includes(p) ? 'on' : ''}" data-act="toggleAlso" data-name="${p}">${p}</button>`).join('')}</div><label>Status</label><div class="chips"><button class="chip ${m.active ? 'on' : ''}" data-act="setActive" data-name="1">Active</button><button class="chip ${!m.active ? 'on' : ''}" data-act="setActive" data-name="0">Inactive</button></div><div class="btns" style="margin-top:16px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="savePlayer">Save</button></div>`;
  }
  return '<div class="scrim" data-act="closeModal"></div><div class="sheet">' + body + '</div>';
}
function pickerHTML(m) {
  const g = game(m.gid), rows = getLines(m.gid), cur = rows.find(r => r.unit === m.unit && r.pos === m.pos);
  const dressed = g.dressed.map(player).filter(Boolean);
  const where = n => { const r = rows.find(x => x.player === n); return r ? unitLabel(r.unit) + ' ' + r.pos : ''; };
  const rec = dressed.filter(p => canPlay(p, m.pos));
  const oth = dressed.filter(p => !canPlay(p, m.pos) && (m.pos === 'G' || p.primary !== 'G'));
  const row = p => `<button class="prow ${cur.player === p.name ? 'sel' : ''}" data-act="assign" data-name="${esc(p.name)}"><span>${esc(p.name)}</span><small>${esc(posTag(p))}${where(p.name) ? ' · on ' + esc(where(p.name)) : ''}</small></button>`;
  return `<h3>${unitLabel(m.unit)} · ${m.pos}</h3>${cur.player ? '<button class="prow" data-act="assign" data-name="" style="color:var(--bad)">Clear this spot</button>' : ''}${rec.length ? '<label>Can play ' + m.pos + '</label>' + rec.map(row).join('') : ''}<label>${rec.length ? 'Others' : 'Dressed players'}</label>${oth.map(row).join('') || '<small>Nobody else dressed</small>'}${g.dressed.length ? '' : '<p class="mut">Mark who is dressed on the Dress tab first.</p>'}<div class="btns"><button class="btn" data-act="closeModal">Close</button></div>`;
}

/* ================= actions ================= */
const A = {
  sync() { refresh(true); flush(); },
  async syncSched() {
    if (demo) return alert('Add your Apps Script URL to CONFIG.API_URL first.');
    setStatus('saving');
    try { await flush(); await post({ action: 'syncSchedule' }); await refresh(true); setStatus('ok'); }
    catch (e) { setStatus('offline'); alert('Schedule sync failed: ' + e.message); }
  },
  openSched(d) {
    const x = S.schedule.find(y => y.id === d.id), names = S.roster.filter(p => p.active !== false).map(p => p.name);
    ui.modal = { kind: 'session', id: x.id, date: x.date, type: 'Practice', names, present: [...names] }; render();
  },
  nav(d) { ui.tab = d.tab; ui.gameId = null; render(); window.scrollTo(0, 0); },
  back() { ui.gameId = null; render(); },
  openGame(d) { ui.gameId = d.id; ui.gtab = 'dress'; render(); window.scrollTo(0, 0); },
  gtab(d) { ui.gtab = d.tab; render(); },
  closeModal() { ui.modal = null; render(); },
  newGame() { ui.modal = { kind: 'game', date: today(), opponent: '', location: '' }; render(); },
  editGame() { const g = game(ui.gameId); ui.modal = { kind: 'game', id: g.id, date: g.date, opponent: g.opponent, location: g.location || '' }; render(); },
  saveGameInfo() {
    const m = ui.modal;
    if (m.id) { const g = game(m.id); Object.assign(g, { date: m.date, opponent: m.opponent.trim(), location: m.location.trim() }); saveGame(g); }
    else { const g = { id: uid(), date: m.date, opponent: m.opponent.trim(), location: m.location.trim(), dressed: S.roster.filter(p => p.active !== false).map(p => p.name), gf: 0, ga: 0 }; S.games.push(g); saveGame(g); ui.gameId = g.id; ui.gtab = 'dress'; }
    ui.modal = null; render();
  },
  delGame() {
    if (!confirm('Delete this game, its lines and goals?')) return;
    const id = ui.modal.id; S.games = S.games.filter(g => g.id !== id); S.lines = S.lines.filter(l => l.gameId !== id); S.events = S.events.filter(e => e.gameId !== id); S.notes = S.notes.filter(n => n.gameId !== id);
    enqueue({ k: 'deleteGame:' + id, action: 'deleteGame', id }); ui.modal = null; ui.gameId = null; render();
  },
  toggleDress(d) {
    const g = game(ui.gameId), i = g.dressed.indexOf(d.name);
    if (i >= 0) { g.dressed.splice(i, 1); const rows = getLines(g.id); if (rows.some(r => r.player === d.name) && S.lines.some(l => l.gameId === g.id)) { rows.forEach(r => { if (r.player === d.name) r.player = ''; }); commitLines(g.id, rows, true); } }
    else g.dressed.push(d.name);
    saveGame(g); render();
  },
  dressAll() { const g = game(ui.gameId); g.dressed = S.roster.filter(p => p.active !== false).map(p => p.name); saveGame(g); render(); },
  dressNone() { const g = game(ui.gameId); g.dressed = []; saveGame(g); if (S.lines.some(l => l.gameId === g.id)) commitLines(g.id, getLines(g.id).map(r => ({ ...r, player: '' }))); else render(); },
  pick(d) { ui.modal = { kind: 'pick', gid: ui.gameId, unit: d.unit, pos: d.pos }; render(); },
  assign(d) { const m = ui.modal; ui.modal = null; assign(m.gid, m.unit, m.pos, d.name); },
  addF() { const r = getLines(ui.gameId), n = new Set(r.filter(x => x.unit[0] === 'F').map(x => x.unit)).size + 1; ['LW','C','RW'].forEach(pos => r.push({ unit: 'F' + n, pos, player: '' })); commitLines(ui.gameId, r); },
  addD() { const r = getLines(ui.gameId), n = new Set(r.filter(x => x.unit[0] === 'D').map(x => x.unit)).size + 1; ['LD','RD'].forEach(pos => r.push({ unit: 'D' + n, pos, player: '' })); commitLines(ui.gameId, r); },
  rmUnit(d) { commitLines(ui.gameId, getLines(ui.gameId).filter(r => r.unit !== d.unit)); },
  clearLines() { if (confirm('Clear everyone from the lines?')) commitLines(ui.gameId, getLines(ui.gameId).map(r => ({ ...r, player: '' }))); },
  copyLast() {
    const g = game(ui.gameId);
    const prev = S.games.filter(x => x.id !== g.id && S.lines.some(l => l.gameId === x.id)).sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
    if (!prev) return alert('No earlier game with lines to copy.');
    if (getLines(g.id).some(r => r.player) && !confirm('Replace current lines with the ones from vs ' + (prev.opponent || 'last game') + '?')) return;
    commitLines(g.id, getLines(prev.id).map(r => ({ ...r, player: g.dressed.includes(r.player) ? r.player : '' })));
  },
  autofill() {
    const g = game(ui.gameId), rows = getLines(g.id), used = new Set(rows.map(r => r.player).filter(Boolean));
    const pool = g.dressed.map(player).filter(Boolean);
    rows.filter(r => !r.player).forEach(r => {
      const c = pool.find(p => !used.has(p.name) && p.primary === r.pos) || pool.find(p => !used.has(p.name) && canPlay(p, r.pos));
      if (c) { r.player = c.name; used.add(c.name); }
    });
    commitLines(g.id, rows);
  },
  stab(d) { ui.stab = d.tab; render(); },
  lfilter(d) { ui.lfilter = d.v; render(); },
  oi(d) { const o = oiSel(ui.gameId); o[d.k] = (d.k === 'per' && o.per === d.v) ? '' : d.v; render(); },
  goalModal() { const o = oiSel(ui.gameId); ui.modal = { kind: 'goal', gid: ui.gameId, period: o.per || '', sit: o.sit, F: o.F, D: o.D, scorer: '', a1: '', a2: '' }; render(); },
  gaModal() { const g = game(ui.gameId), o = oiSel(g.id); ui.modal = { kind: 'ga', gid: g.id, period: o.per || '', sit: o.sit, F: o.F, D: o.D, goalie: goalieNow(g.id) }; render(); },
  penModal(d) { const o = oiSel(ui.gameId); ui.modal = { kind: 'pen', gid: ui.gameId, opp: d.opp === '1', period: o.per || '', player: '', infr: '', mins: 2 }; render(); },
  shot(d) { logEvent(ui.gameId, d.t, d.t === 'SA' ? { goalie: goalieNow(ui.gameId) } : {}); },
  setPeriod(d) { ui.modal.period = ui.modal.period === d.name ? '' : d.name; render(); },
  setSit(d) { ui.modal.sit = d.name; render(); },
  setMF(d) { ui.modal.F = d.name; render(); },
  setMD(d) { ui.modal.D = d.name; render(); },
  setScorer(d) { const m = ui.modal; m.scorer = m.scorer === d.name ? '' : d.name; if (m.a1 === m.scorer) m.a1 = ''; if (m.a2 === m.scorer) m.a2 = ''; render(); },
  setA1(d) { const m = ui.modal; m.a1 = m.a1 === d.name ? '' : d.name; if (m.a2 === m.a1) m.a2 = ''; render(); },
  setA2(d) { const m = ui.modal; m.a2 = m.a2 === d.name ? '' : d.name; render(); },
  setGoalie(d) { ui.modal.goalie = d.name; render(); },
  setPlayer(d) { ui.modal.player = ui.modal.player === d.name ? '' : d.name; render(); },
  setInfr(d) { ui.modal.infr = d.name; render(); },
  setMins(d) { ui.modal.mins = Number(d.name); render(); },
  saveGoal() {
    const m = ui.modal; if (!m.scorer) return;
    addEvent({ ...baseEv(m.gid, 'GF'), period: m.period, situation: m.sit, ...snap(m.gid, m.F, m.D), player: m.scorer, a1: m.a1, a2: m.a2 });
  },
  saveGA() { const m = ui.modal; addEvent({ ...baseEv(m.gid, 'GA'), period: m.period, situation: m.sit, ...snap(m.gid, m.F, m.D), goalie: m.goalie }); },
  savePen() {
    const m = ui.modal; if (!m.infr || (!m.opp && !m.player)) return;
    addEvent({ ...baseEv(m.gid, m.opp ? 'PENO' : 'PEN'), period: m.period, situation: '', player: m.opp ? '' : m.player, infraction: m.infr, mins: m.mins });
  },
  undo() { const e = S.events.filter(x => x.gameId === ui.gameId).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0]; if (e) removeEvent(e.id); },
  delEvent(d) { if (confirm('Delete this entry?')) removeEvent(d.id); },
  noteModal() { ui.modal = { kind: 'note', gid: ui.gameId, player: '', text: '' }; render(); },
  setNotePlayer(d) { ui.modal.player = ui.modal.player === d.name ? '' : d.name; render(); },
  saveNote() {
    const m = ui.modal; if (!m.text.trim()) return;
    const n = { id: uid(), gameId: m.gid, player: m.player, text: m.text.trim(), ts: Date.now() }, g = game(m.gid);
    S.notes.push(n); enqueue({ action: 'saveNote', note: n, date: g.date, opponent: g.opponent }); ui.modal = null; render();
  },
  delNote(d) { if (!confirm('Delete this note?')) return; S.notes = S.notes.filter(n => n.id !== d.id); enqueue({ action: 'deleteNote', id: d.id }); render(); },
  newSession() { ui.modal = { kind: 'session', id: '', date: today(), type: 'Practice', names: S.roster.filter(p => p.active !== false).map(p => p.name), present: S.roster.filter(p => p.active !== false).map(p => p.name) }; render(); },
  openSession(d) {
    const s = sessions().find(x => x.id === d.id), names = s.rows.map(r => r.player);
    S.roster.filter(p => p.active !== false && !names.includes(p.name)).forEach(p => names.push(p.name));
    ui.modal = { kind: 'session', id: s.id, date: s.date, type: s.type || 'Practice', names, present: s.rows.filter(r => r.present === 'Yes').map(r => r.player) }; render();
  },
  togglePresent(d) { const m = ui.modal, i = m.present.indexOf(d.name); if (i >= 0) m.present.splice(i, 1); else m.present.push(d.name); render(); },
  presentAll() { ui.modal.present = [...ui.modal.names]; render(); },
  presentNone() { ui.modal.present = []; render(); },
  saveSession() {
    const m = ui.modal, id = m.id || uid();
    const rows = m.names.map(n => ({ sessionId: id, date: m.date, type: m.type, player: n, present: m.present.includes(n) ? 'Yes' : 'No' }));
    S.attendance = S.attendance.filter(a => a.sessionId !== id).concat(rows);
    enqueue({ k: 'saveAttendance:' + id, action: 'saveAttendance', sessionId: id, date: m.date, type: m.type, rows: rows.map(r => ({ player: r.player, present: r.present })) });
    ui.modal = null; render();
  },
  delSession() { if (!confirm('Delete this attendance record?')) return; const id = ui.modal.id; S.attendance = S.attendance.filter(a => a.sessionId !== id); enqueue({ action: 'deleteSession', sessionId: id }); ui.modal = null; render(); },
  addPlayer() { ui.modal = { kind: 'player', orig: '', name: '', jersey: '', primary: '', also: [], active: true }; render(); },
  editPlayer(d) { const p = player(d.name); ui.modal = { kind: 'player', orig: p.name, name: p.name, jersey: p.jersey || '', primary: p.primary || '', also: [...(p.also || [])], active: p.active !== false }; render(); },
  toggleAlso(d) { const a = ui.modal.also, i = a.indexOf(d.name); if (i >= 0) a.splice(i, 1); else a.push(d.name); render(); },
  setActive(d) { ui.modal.active = d.name === '1'; render(); },
  savePlayer() {
    const m = ui.modal, name = m.name.trim();
    if (!name) return alert('Enter a name.');
    if (!m.orig && player(name)) return alert('That player already exists.');
    const rec = { name, jersey: m.jersey.trim(), primary: m.primary, also: m.also.filter(p => p !== m.primary), active: m.active };
    if (m.orig) Object.assign(player(m.orig), rec); else S.roster.push(rec);
    S.roster.sort((a, b) => a.name.localeCompare(b.name));
    enqueue({ k: 'saveRoster', action: 'saveRoster', roster: S.roster }); ui.modal = null; render();
  },
};
function addEvent(ev) {
  const g = game(ev.gameId); S.events.push(ev);
  enqueue({ action: 'saveEvent', event: ev, date: g.date, opponent: g.opponent });
  if (ev.type === 'GF' || ev.type === 'GA') recalc(g);
  persist(); ui.modal = null; render();
}
function removeEvent(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  S.events = S.events.filter(x => x.id !== id);
  enqueue({ action: 'deleteEvent', id, gameId: e.gameId, type: e.type });
  if (e.type === 'GF' || e.type === 'GA') recalc(game(e.gameId));
  persist(); render();
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = A[t.dataset.act]; if (f) f(t.dataset);
});
const bind = e => { const t = e.target; if (t.dataset && t.dataset.bind && ui.modal) { ui.modal[t.dataset.bind] = t.value; if (t.tagName === 'SELECT' && ui.modal.kind === 'player') render(); } };
document.addEventListener('input', bind); document.addEventListener('change', bind);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('online', () => { flush(); refresh(); });

/* ================= boot ================= */
render();
if (!demo) { refresh(); flush(); setInterval(() => refresh(), CONFIG.POLL_MS); }
})();
</script>
</body>
</html>
